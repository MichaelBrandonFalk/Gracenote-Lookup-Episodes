name: Versioned macOS release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install '.[build]'
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_app.py
      - name: Verify packaged UI and worker
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP_VERSION=$(python -c 'from gracenote_lookup import __version__; print(__version__)')
          "dist/Gracenote Episode Lookup v$APP_VERSION.app/Contents/MacOS/Gracenote Episode Lookup v$APP_VERSION" --self-test build/ui-check.png
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: downloads/*
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: downloads
      - name: Publish a new release without replacing earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists. Use a new version; do not overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" downloads/* --verify-tag --generate-notes --title "Gracenote Episode Lookup $RELEASE_TAG"
