[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gracenote-episode-lookup"
dynamic = ["version"]
description = "Desktop Gracenote movie, series and episode ID lookup for avails workbooks and CSVs"
requires-python = ">=3.11"
dependencies = ["selenium==4.39.0", "PySide6==6.11.2"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]

[project.gui-scripts]
gracenote-episode-lookup = "gracenote_lookup.desktop:main"

[tool.setuptools]
packages = ["gracenote_lookup"]

[tool.setuptools.dynamic]
version = {attr = "gracenote_lookup.__version__"}
